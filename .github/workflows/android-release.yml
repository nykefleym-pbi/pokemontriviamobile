name: Android Release

# Tag-triggered, not push-triggered. A release should be a deliberate act with a
# name attached, and the tag is what supplies `versionName`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Gradle for Android needs a JDK; 17 is what the Android Gradle Plugin
      # used by Expo SDK 57 expects.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The same four gates as ci.yml -- all four. A tag must not be able to
      # ship something that would have failed a pull request. The Metro bundle
      # is the one that catches monorepo resolution breakage; gradle would hit
      # it too, but twenty minutes later and inside a gradle stack trace.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle --workspace @ptb/mobile

      - name: Resolve version
        id: v
        run: |
          NAME="${{ github.event.inputs.version || github.ref_name }}"
          echo "name=${NAME#v}" >> "$GITHUB_OUTPUT"

      # `prebuild` generates the native android/ project, which is gitignored —
      # it is a build product, and keeping it out of the repo means the Expo
      # config stays the single source of truth for native settings.
      # `working-directory` is load-bearing, and its absence did NOT fail loudly
      # — which is why it survived review. The Expo project is apps/mobile; the
      # repo root has no app config, so prebuild there SUCCEEDS against Expo's
      # defaults and writes ./android with `applicationId
      # com.anonymous.pokemontriviamobile`, versionCode 1 and versionName
      # "1.0.0" — wrong package, and the CI version plumbing ignored entirely.
      # The gradle step below then fails only because apps/mobile/android does
      # not exist. Repointing gradle at the root android/ would "fix" that and
      # ship the wrong applicationId to Play, which binds it permanently on
      # first upload. Verified by running both: from apps/mobile,
      # ANDROID_VERSION_CODE=42 APP_VERSION=1.2.3 yields versionCode 42 /
      # versionName 1.2.3 and the real package name.
      - name: Prebuild (generate android/)
        working-directory: apps/mobile
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ steps.v.outputs.name }}
        run: npx expo prebuild --platform android --no-install

      # The keystore is stored base64-encoded because GitHub secrets are text.
      # It is written outside the repo and removed in an always() step, so a
      # failed build cannot leave a signing key in the workspace.
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # The signing secrets arrive through `env`, not `${{ }}` interpolated
      # into the command. Interpolation pastes the literal password into the
      # shell, so a password containing a quote, a `$` or a backtick would
      # either break the command or be re-interpreted by it.
      - name: Build signed AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ steps.v.outputs.name }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-trivia-battle-${{ steps.v.outputs.name }}-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
